name: Bug report
description: Something is broken in this Codex-style fork
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please make sure this is about **this fork's UI**,
        not a general pi-web issue. General problems belong
        [upstream](https://github.com/agegr/pi-web/issues).
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running this fork (not the official pi-web).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project...
        2. Send the first message...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: OS & Node.js version
      placeholder: "macOS 15.2, Node v22.19.0, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Server logs, browser console output, or screenshots.
      render: shell
    validations:
      required: false
