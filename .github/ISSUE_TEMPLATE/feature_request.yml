name: Feature request
description: Suggest an idea for the Codex-style UI
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This fork has a clear direction: make Pi Web feel closer to **Codex**
        (clean, project-first). Please keep suggestions aligned with that.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the friction you hit today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: mockup
    attributes:
      label: Mockups / references
      description: Screenshots or links that illustrate the idea.
    validations:
      required: false
